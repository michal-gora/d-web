<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wrocław Heatwave Monitor</title>
    <link href="https://fonts.googleapis.com/css2?family=Just+Another+Hand&display=swap" rel="stylesheet">
    <style>
        /* --- DYNAMIC CSS VARIABLES --- */
        :root {
            --steam-intensity: 0;
            --smoke-intensity: 0;
            --fire-intensity: 0;
        }

        /* --- GLOBAL STYLES --- */
        body {
            background-color: #e2d8c3;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
            font-family: 'Arial', sans-serif;
            color: #333;
            overflow-x: hidden;
            transition: background-color 1s ease;
        }

        #weather-dashboard {
            text-align: center;
            background: rgba(255, 255, 255, 0.6);
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
            max-width: 550px;
            width: 100%;
        }

        h1 {
            font-family: 'Just Another Hand', cursive;
            font-size: 5rem;
            margin: 0;
            color: #d35400;
        }

        h2 {
            font-family: 'Just Another Hand', cursive;
            font-size: 2.2rem;
            margin-top: 0;
            margin-bottom: 40px;
            color: #555;
            line-height: 1.2;
        }

        /* --- THE SCENE --- */
        .scene {
            display: flex;
            justify-content: center;
            align-items: flex-end;
            gap: 30px;
            height: 220px;
            position: relative;
        }

        /* --- THE GNOME --- */
        .gnome-wrap {
            position: relative;
            width: 160px;
            height: 180px;
            display: flex;
            align-items: flex-end;
            justify-content: center;
        }

        .gnome-img {
            height: 150px;
            width: auto;
            object-fit: contain;
            position: relative;
            z-index: 2;
            transition: transform 0.8s ease, filter 0.8s ease;
            transform-origin: bottom center;
        }

        /* --- THE PAN & PIERÓG --- */
        .pan-container {
            position: relative;
            width: 120px;
            height: 120px;
            display: flex;
            justify-content: center;
            align-items: flex-end;
        }

        .pan {
            position: absolute;
            bottom: 10px;
            width: 100px;
            height: 20px;
            background-color: #222;
            border-radius: 50%;
            box-shadow: 0 10px 10px rgba(0, 0, 0, 0.3);
            z-index: 1;
        }

        .pierog {
            font-size: 3.5rem;
            position: absolute;
            bottom: 15px;
            transition: all 1s ease;
            z-index: 2;
        }

        /* --- DYNAMIC STEAM --- */
        .steam {
            position: absolute;
            left: 50%;
            bottom: 110px;
            transform: translateX(-50%) scale(calc(0.2 + var(--steam-intensity) * 0.8));
            transform-origin: bottom center;
            width: 100px;
            height: 120px;
            pointer-events: none;
            z-index: 4;
            opacity: var(--steam-intensity);
        }

        .steam span {
            position: absolute;
            bottom: 0;
            width: 40px;
            /* Made base particle larger */
            height: 40px;
            border-radius: 50%;
            /* Solid white core, fading out at the edges */
            background: radial-gradient(circle, rgba(255, 255, 255, 1) 0%, rgba(255, 255, 255, 0.6) 60%, rgba(255, 255, 255, 0) 80%);
            filter: blur(2px);
            /* Reduced blur so it stays solid */
            opacity: 0;
            animation: steamRise 3s infinite ease-out;
        }

        .steam span:nth-child(1) {
            left: 5px;
            animation-delay: 0s;
        }

        .steam span:nth-child(2) {
            left: 30px;
            animation-delay: 0.6s;
        }

        .steam span:nth-child(3) {
            left: 55px;
            animation-delay: 1.2s;
        }

        .steam span:nth-child(4) {
            left: 80px;
            animation-delay: 1.8s;
        }

        @keyframes steamRise {
            0% {
                transform: translateY(0) scale(0.8);
                opacity: 0;
            }

            20% {
                opacity: 1;
            }

            /* Full opacity! */
            60% {
                transform: translateY(-60px) scale(1.5);
                opacity: 0.8;
            }

            100% {
                transform: translateY(-120px) scale(2.5);
                opacity: 0;
            }
        }

        /* --- DYNAMIC MASSIVE SMOKE --- */
        .smoke {
            position: absolute;
            left: 50%;
            bottom: 60px;
            /* Drastically increased max scale multiplier from 1.3 to 3.0 */
            transform: translateX(-50%) scale(calc(0.1 + var(--smoke-intensity) * 3.0));
            transform-origin: bottom center;
            width: 120px;
            height: 150px;
            pointer-events: none;
            z-index: 10;
            /* Brought to the front to cover the scene */
            opacity: var(--smoke-intensity);
        }

        .smoke span {
            position: absolute;
            bottom: 0;
            width: 60px;
            /* Bigger base particle */
            height: 60px;
            border-radius: 50%;
            /* Much darker gradient */
            background: radial-gradient(circle, rgba(20, 20, 20, 0.95) 0%, rgba(50, 50, 50, 0.8) 55%, rgba(0, 0, 0, 0) 75%);
            filter: blur(5px);
            opacity: 0;
            animation: massiveSmoke 2.5s infinite ease-in;
        }

        /* 6 staggered particles for a thicker cloud */
        .smoke span:nth-child(1) {
            left: -10px;
            animation-delay: 0s;
        }

        .smoke span:nth-child(2) {
            left: 30px;
            animation-delay: 0.4s;
        }

        .smoke span:nth-child(3) {
            left: 60px;
            animation-delay: 0.8s;
        }

        .smoke span:nth-child(4) {
            left: 10px;
            animation-delay: 1.2s;
        }

        .smoke span:nth-child(5) {
            left: 40px;
            animation-delay: 1.6s;
        }

        .smoke span:nth-child(6) {
            left: -5px;
            animation-delay: 2.0s;
        }

        @keyframes massiveSmoke {
            0% {
                transform: translateY(0) scale(0.5);
                opacity: 0;
            }

            20% {
                opacity: 0.9;
            }

            60% {
                transform: translateY(-70px) scale(3);
                opacity: 0.7;
            }

            /* Particles expand to 5x their size as they drift upwards */
            100% {
                transform: translateY(-150px) scale(5);
                opacity: 0;
            }
        }

        /* --- DYNAMIC FIRE --- */
        .fire {
            position: absolute;
            bottom: 5px;
            left: 50%;
            transform: translateX(-50%) scale(calc(0.1 + var(--fire-intensity) * 1.2));
            /* Bigger fire */
            transform-origin: bottom center;
            width: 70px;
            height: 90px;
            pointer-events: none;
            z-index: 5;
            opacity: var(--fire-intensity);
        }

        .flame {
            position: absolute;
            bottom: 0;
            left: 50%;
            border-radius: 50% 50% 35% 35%;
            transform-origin: center bottom;
            background: linear-gradient(to top, #ff4500 0%, #ff8c00 38%, #ffd54a 72%, rgba(255, 255, 255, 0.95) 100%);
            box-shadow: 0 0 18px rgba(255, 120, 0, 0.55);
            animation: flameFlicker 0.6s infinite alternate ease-in-out;
        }

        .flame-1 {
            width: 30px;
            height: 65px;
            margin-left: -15px;
            z-index: 3;
        }

        .flame-2 {
            width: 22px;
            height: 45px;
            margin-left: -28px;
            bottom: 4px;
            animation-delay: 0.15s;
            opacity: 0.9;
        }

        .flame-3 {
            width: 20px;
            height: 40px;
            margin-left: 10px;
            bottom: 6px;
            animation-delay: 0.3s;
            opacity: 0.85;
        }

        @keyframes flameFlicker {
            0% {
                transform: scaleY(1) rotate(-3deg);
                opacity: 0.9;
            }

            50% {
                transform: scaleY(1.1) rotate(3deg);
                opacity: 1;
            }

            100% {
                transform: scaleY(0.9) rotate(-4deg);
                opacity: 0.85;
            }
        }

        /* --- DISCRETE HEATWAVE STATES (For the static images) --- */
        .state-warm .pierog {
            filter: sepia(1) saturate(3) hue-rotate(-30deg);
            transform: translateY(-5px) rotate(5deg);
        }

        .state-hot {
            background-color: #d1bfae;
        }

        .state-hot .pierog {
            filter: brightness(0.15);
            transform: translateY(-5px) rotate(-10deg);
        }

        .state-hot .gnome-img {
            filter: drop-shadow(0 15px 10px rgba(180, 50, 0, 0.4));
        }
    </style>
</head>

<body>

    <div id="weather-dashboard">
        <h1 id="temp-display">Pingowanie krasnali... 📡</h1>
        <h2 id="status-text">Sprawdzanie temperatury bruku...</h2>

        <div class="scene">
            <div class="gnome-wrap">
                <img id="gnome" class="gnome-img"
                    src="https://user-gen-media-assets.s3.amazonaws.com/gpt4o_images/cb2f6fe2-1d3d-4ad9-bb0f-4192474c9c60.png"
                    alt="Wrocław Krasnal">
                <div class="steam" aria-hidden="true"><span></span><span></span><span></span><span></span></div>

                <!-- Added 6 spans for thicker smoke -->
                <div class="smoke" aria-hidden="true">
                    <span></span><span></span><span></span><span></span>
                </div>

                <div class="fire" aria-hidden="true"><span class="flame flame-1"></span><span
                        class="flame flame-2"></span><span class="flame flame-3"></span></div>
            </div>

            <div class="pan-container">
                <div class="pan"></div>
                <div id="pierog" class="pierog">🥟</div>

                <!-- Added 6 spans for thicker smoke -->
                <div class="smoke" aria-hidden="true">
                    <span></span><span></span><span></span><span></span>
                </div>

                <div class="fire" aria-hidden="true"><span class="flame flame-1"></span><span
                        class="flame flame-2"></span><span class="flame flame-3"></span></div>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            fetchWeather();
        });

        function getIntensity(temp, minTemp, maxTemp) {
            return Math.max(0, Math.min(1, (temp - minTemp) / (maxTemp - minTemp)));
        }

        async function fetchWeather() {
            const tempDisplay = document.getElementById('temp-display');
            const statusText = document.getElementById('status-text');
            const gnome = document.getElementById('gnome');

            const imgNormal = "https://user-gen-media-assets.s3.amazonaws.com/gpt4o_images/cb2f6fe2-1d3d-4ad9-bb0f-4192474c9c60.png";
            const imgSweat = "https://user-gen-media-assets.s3.amazonaws.com/gpt4o_images/8e451cde-dd15-4b76-a4cf-1a1b667632ad.png";
            const imgMelt = "https://user-gen-media-assets.s3.amazonaws.com/gpt4o_images/268f835c-1a4d-41e8-adfe-94df92e6b88d.png";

            const lat = 51.1079;
            const lon = 17.0385;
            const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,apparent_temperature&timezone=Europe%2FWarsaw`;

            try {
                const response = await fetch(url);
                const data = await response.json();

                let temp = 38; data.current.temperature_2m;
                const feelsLike = data.current.apparent_temperature;

                // --- TEST MODE --- 
                // Uncomment to test extreme temperatures (e.g. 38)
                // temp = 38; 

                tempDisplay.innerText = `${temp}°C`;

                const steamLevel = getIntensity(temp, 22, 28);
                const smokeLevel = getIntensity(temp, 20, 38);
                const fireLevel = getIntensity(temp, 28, 35);

                document.documentElement.style.setProperty('--steam-intensity', steamLevel);
                document.documentElement.style.setProperty('--smoke-intensity', smokeLevel);
                document.documentElement.style.setProperty('--fire-intensity', fireLevel);

                if (temp < 25) {
                    statusText.innerHTML = `Odczuwalna: ${feelsLike}°C.<br>Krasnale są bezpieczne. Pierogi surowe.`;
                    gnome.src = imgNormal;
                    document.body.classList.remove('state-warm', 'state-hot');
                } else if (temp >= 25 && temp < 30) {
                    statusText.innerHTML = `Odczuwalna: ${feelsLike}°C.<br>Krasnal paruje. Pierogi wchodzą na patelnię.`;
                    gnome.src = imgSweat;
                    document.body.classList.remove('state-hot');
                    document.body.classList.add('state-warm');
                } else {
                    statusText.innerHTML = `Odczuwalna: ${feelsLike}°C.<br>ALARM: Krasnal się topi, a pierogi płoną!`;
                    gnome.src = imgMelt;
                    document.body.classList.remove('state-warm');
                    document.body.classList.add('state-hot');
                }

            } catch (error) {
                console.error("Error fetching weather:", error);
                tempDisplay.innerText = "Błąd API 💥";
                statusText.innerText = "Za gorąco. Serwery pogodowe się stopiły.";
            }
        }
    </script>
</body>

</html>
