<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wrocław Heatwave Monitor</title>
    <link href="https://fonts.googleapis.com/css2?family=Just+Another+Hand&display=swap" rel="stylesheet">
    <style>
        /* --- DYNAMIC CSS VARIABLES --- */
        :root {
            --steam-intensity: 0;
            --smoke-intensity: 0;
            --fire-intensity: 0;
        }

        /* --- GLOBAL STYLES --- */
        body {
            background-color: #e2d8c3;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
            font-family: 'Arial', sans-serif;
            color: #333;
            overflow-x: hidden;
            transition: background-color 1s ease;
        }

        #weather-dashboard {
            text-align: center;
            background: rgba(255, 255, 255, 1.0);
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
            max-width: 550px;
            width: 100%;
        }

        h1 {
            font-family: 'Just Another Hand', cursive;
            font-size: 5rem;
            margin: 0;
            color: #d35400;
        }

        h2 {
            font-family: 'Just Another Hand', cursive;
            font-size: 2.2rem;
            margin-top: 0;
            margin-bottom: 40px;
            color: #555;
            line-height: 1.2;
        }

        h1,
        h2,
        .location-title {
            position: relative;
            z-index: 20;
            /* Optional: Add a tiny text-shadow so it stays readable if smoke goes behind it */
            text-shadow: 0px 2px 10px rgba(255, 255, 255, 0.8);
        }

        /* --- THE SCENE --- */
        .scene {
            display: flex;
            justify-content: center;
            align-items: flex-end;
            gap: 30px;
            height: 220px;
            position: relative;
        }

        .location-title {
            font-family: 'Just Another Hand', cursive;
            font-size: 2rem;
            color: #777;
            margin: 0 0 30px 0;
            /* Pulls it slightly closer to the big temperature text */
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        /* --- THE GNOME --- */
        .gnome-wrap {
            position: relative;
            width: 160px;
            height: 180px;
            display: flex;
            align-items: flex-end;
            justify-content: center;
        }

        .gnome-img {
            height: 250px;
            width: auto;
            object-fit: contain;
            position: relative;
            z-index: 1;
            /* Remove the infinite animation from here */
            transform-origin: bottom center;
        }

        /* The class JS will add/remove to trigger the jump */
        .jumping {
            animation: jump 0.1s ease-in-out forwards;
        }

        @keyframes jump {
            0% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-30px);
            }

            /* Peak of jump */
            100% {
                transform: translateY(0);
            }
        }


        /* --- THE PAN & PIERÓG --- */
        .pan-container {
            position: relative;
            width: 120px;
            height: 120px;
            bottom: 80px;
            left: 50px;
            display: flex;
            justify-content: center;
            align-items: flex-end;
        }

        .pan {
            position: absolute;
            bottom: 0px;
            width: 100px;
            height: 20px;
            background-color: #222;
            border-radius: 50%;
            box-shadow: 0 10px 10px rgba(0, 0, 0, 0.3);
            z-index: 2;
        }

        /* --- THE PAN HANDLE (Flipped Left) --- */
        .pan::after {
            content: "";
            position: absolute;
            left: -45px;
            /* Stick it out to the left instead of right */
            top: 5px;
            width: 50px;
            height: 8px;
            background-color: #222;
            border-radius: 4px;
            transform: rotate(15deg);
            /* Point it slightly upwards (positive rotation now) */
            transform-origin: right center;
            /* Origin switched to the right */
            box-shadow: -2px 5px 5px rgba(0, 0, 0, 0.3);
        }

        .pierog {
            font-size: 3.5rem;
            position: absolute;
            bottom: 15px;
            transition: all 1s ease;
            z-index: 2;
        }

        /* --- DYNAMIC STEAM --- */
        .steam {
            position: absolute;
            left: 50%;
            bottom: 110px;
            transform: translateX(-50%) scale(calc(0.2 + var(--steam-intensity) * 0.8));
            transform-origin: bottom center;
            width: 100px;
            height: 120px;
            pointer-events: none;
            z-index: 4;
            opacity: var(--steam-intensity);
        }

        .steam span {
            position: absolute;
            bottom: 0;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: radial-gradient(circle, rgb(229, 229, 229, 1.0) 0%, rgba(229, 229, 229, 0.6) 60%, rgba(229, 229, 229, 0) 80%);
            filter: blur(2px);
            opacity: 0;

            /* The JS custom properties are injected here */
            animation: steamRise var(--rnd-duration, 3s) infinite ease-out;
            animation-delay: var(--rnd-delay, 0s);
        }

        .steam span:nth-child(1) {
            left: 5px;
        }

        .steam span:nth-child(2) {
            left: 30px;
        }

        .steam span:nth-child(3) {
            left: 55px;
        }

        .steam span:nth-child(4) {
            left: 80px;
        }

        @keyframes steamRise {
            0% {
                transform: translate(0, 0) scale(0.8);
                opacity: 0;
            }

            20% {
                opacity: 1;
            }

            60% {
                /* Uses JS variables for random X drift and Scale */
                transform: translate(calc(var(--rnd-x) * 0.5), -60px) scale(calc(var(--rnd-scale) * 0.6));
                opacity: 0.8;
            }

            100% {
                transform: translate(var(--rnd-x), -120px) scale(var(--rnd-scale));
                opacity: 0;
            }
        }

        /* --- DYNAMIC MASSIVE SMOKE --- */
        .smoke {
            position: absolute;
            left: 50%;
            bottom: 0px;
            transform: translateX(-50%) scale(calc(0.1 + var(--smoke-intensity) * 3.0));
            transform-origin: bottom center;
            width: 120px;
            height: 150px;
            pointer-events: none;
            z-index: 10;
            opacity: var(--smoke-intensity);
        }

        .smoke span {
            position: absolute;
            bottom: 0;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(20, 20, 20, 0.95) 0%, rgba(50, 50, 50, 0.8) 55%, rgba(0, 0, 0, 0) 75%);
            filter: blur(5px);
            opacity: 0;

            /* Randomized Duration and Delay */
            animation: massiveSmoke var(--rnd-duration, 2.5s) infinite ease-in;
            animation-delay: var(--rnd-delay, 0s);
        }

        /* Base positions (delays are now completely handled by JS) */
        .smoke span:nth-child(1) {
            left: -10px;
        }

        .smoke span:nth-child(2) {
            left: 30px;
        }

        .smoke span:nth-child(3) {
            left: 60px;
        }

        .smoke span:nth-child(4) {
            left: 10px;
        }

        .smoke span:nth-child(5) {
            left: 40px;
        }

        .smoke span:nth-child(6) {
            left: -5px;
        }

        @keyframes massiveSmoke {
            0% {
                transform: translate(0, 0) scale(0.5);
                opacity: 0;
            }

            20% {
                opacity: 0.9;
            }

            60% {
                /* Uses JS variables to drift sideways and scale up differently */
                transform: translate(calc(var(--rnd-x) * 0.5), -70px) scale(calc(var(--rnd-scale) * 0.6));
                opacity: 0.7;
            }

            100% {
                transform: translate(var(--rnd-x), -150px) scale(var(--rnd-scale));
                opacity: 0;
            }
        }

        /* --- DYNAMIC FIRE --- */
        .fire {
            position: absolute;
            bottom: 5px;
            left: 50%;
            transform: translateX(-50%) scale(calc(0.1 + var(--fire-intensity) * 1.2));
            transform-origin: bottom center;
            width: 70px;
            height: 90px;
            pointer-events: none;
            z-index: 5;
            opacity: var(--fire-intensity);
        }

        .flame {
            position: absolute;
            bottom: 0;
            left: 50%;
            border-radius: 50% 50% 35% 35%;
            transform-origin: center bottom;
            background: linear-gradient(to top, #ff4500 0%, #ff8c00 38%, #ffd54a 72%, rgba(255, 255, 255, 0.95) 100%);
            box-shadow: 0 0 18px rgba(255, 120, 0, 0.55);

            /* Random flicker speed and offset */
            animation: flameFlicker var(--rnd-duration, 0.6s) infinite alternate ease-in-out;
            animation-delay: var(--rnd-delay, 0s);
        }

        .flame-1 {
            width: 30px;
            height: 65px;
            margin-left: -15px;
            bottom: 4px;
            z-index: 3;
            opacity: 0.9;
        }

        .flame-2 {
            width: 22px;
            height: 45px;
            margin-left: -28px;
            bottom: 6px;
            opacity: 0.8;
        }

        .flame-3 {
            width: 20px;
            height: 40px;
            margin-left: 10px;
            bottom: 8px;
            opacity: 0.75;
        }

        @keyframes flameFlicker {
            0% {
                transform: scaleY(1) rotate(-3deg);
                opacity: 0.9;
            }

            50% {
                transform: scaleY(1.1) rotate(3deg);
                opacity: 0.95;
            }

            100% {
                transform: scaleY(0.9) rotate(-4deg);
                opacity: 0.85;
            }
        }

        /* --- DISCRETE HEATWAVE STATES (For static styling) --- */
        .state-warm .pierog {
            filter: sepia(1) saturate(3) hue-rotate(-30deg);
            transform: translateY(-5px) rotate(5deg);
        }

        .state-hot {
            background-color: #d1bfae;
        }

        .state-hot .pierog {
            filter: brightness(0.15);
            transform: translateY(-5px) rotate(-10deg);
        }
    </style>
</head>

<body>

    <div id="weather-dashboard">
        <p class="location-title">📍 Wrocław, Polska</p>
        <h1 id="temp-display">Pingowanie krasnali... 📡</h1>
        <h2 id="status-text">Sprawdzanie temperatury bruku...</h2>

        <div class="scene">
            <div class="gnome-wrap">
                <img id="gnome" class="gnome-img"
                    src="https://user-gen-media-assets.s3.amazonaws.com/gpt4o_images/cb2f6fe2-1d3d-4ad9-bb0f-4192474c9c60.png"
                    alt="Wrocław Krasnal">

                <div class="steam particle-layer" aria-hidden="true">
                    <span></span><span></span><span></span><span></span>
                </div>

                <div class="smoke particle-layer" aria-hidden="true">
                    <span></span><span></span><span></span><span></span><span></span><span></span>
                </div>
            </div>

            <div class="pan-container">
                <div class="pan"></div>
                <div id="pierog" class="pierog">🥟</div>

                <div class="smoke particle-layer" aria-hidden="true">
                    <span></span><span></span><span></span><span></span><span></span><span></span>
                </div>

                <div class="fire" aria-hidden="true">
                    <span class="flame flame-1"></span><span class="flame flame-2"></span><span
                        class="flame flame-3"></span>
                </div>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            randomizeParticles();
            fetchWeather();
        });

        // Injects totally random physics variables into EVERY single animated span
        function randomizeParticles() {
            // Steam & Smoke Spans
            const clouds = document.querySelectorAll('.particle-layer span');
            clouds.forEach(particle => {
                // Random drift left/right between -40px and +40px
                const randomX = (Math.random() * 80 - 40).toFixed(0);
                // Random scale end size between 3.5x and 6x
                const randomScale = (3.5 + Math.random() * 2.5).toFixed(2);
                // Random animation cycle time between 2s and 4s
                const randomDuration = (2 + Math.random() * 2).toFixed(2);
                // Random start offset so they never sync up
                const randomDelay = (Math.random() * -5).toFixed(2);

                particle.style.setProperty('--rnd-x', `${randomX}px`);
                particle.style.setProperty('--rnd-scale', randomScale);
                particle.style.setProperty('--rnd-duration', `${randomDuration}s`);
                particle.style.setProperty('--rnd-delay', `${randomDelay}s`);
            });

            // Fire Spans (Need tighter, faster variables)
            const flames = document.querySelectorAll('.flame');
            flames.forEach(flame => {
                const randomDuration = (0.4 + Math.random() * 0.4).toFixed(2); // 0.4s - 0.8s
                const randomDelay = (Math.random() * -2).toFixed(2);

                flame.style.setProperty('--rnd-duration', `${randomDuration}s`);
                flame.style.setProperty('--rnd-delay', `${randomDelay}s`);
            });
        }

        function getIntensity(temp, minTemp, maxTemp) {
            return Math.max(0, Math.min(1, (temp - minTemp) / (maxTemp - minTemp)));
        }

        async function fetchWeather() {
            const tempDisplay = document.getElementById('temp-display');
            const statusText = document.getElementById('status-text');
            const gnome = document.getElementById('gnome');

            const imgNormal = "krasnal0.png";
            const imgSweat = "krasnal1.png";
            const imgMelt = "krasnal2.png";

            const lat = 51.1079;
            const lon = 17.0385;
            const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,apparent_temperature&timezone=Europe%2FWarsaw`;

            try {
                const response = await fetch(url);
                const data = await response.json();

                let temp = data.current.temperature_2m;
                const feelsLike = data.current.apparent_temperature;

                // --- TEST MODE --- 
                // Uncomment to test extreme temperatures (e.g. 38)
                // temp = 20.0;

                tempDisplay.innerText = `${temp}°C`;

                const steamLevel = getIntensity(temp, 20, 28);
                const smokeLevel = getIntensity(temp, 25, 38);
                const fireLevel = getIntensity(temp, 28, 35);

                document.documentElement.style.setProperty('--steam-intensity', steamLevel);
                document.documentElement.style.setProperty('--smoke-intensity', smokeLevel);
                document.documentElement.style.setProperty('--fire-intensity', fireLevel);

                if (temp < 25) {
                    statusText.innerHTML = `Odczuwalna: ${feelsLike}°C.<br>Krasnale są bezpieczne. Pierogi surowe.`;
                    gnome.src = imgNormal;
                    document.body.classList.remove('state-warm', 'state-hot');
                } else if (temp >= 25 && temp < 35) {
                    statusText.innerHTML = `Odczuwalna: ${feelsLike}°C.<br>Krasnal paruje. Pierogi wchodzą na patelnię.`;
                    gnome.src = imgSweat;
                    document.body.classList.remove('state-hot');
                    document.body.classList.add('state-warm');
                } else {
                    statusText.innerHTML = `Odczuwalna: ${feelsLike}°C.<br>ALARM: Krasnal się topi, a pierogi płoną!`;
                    gnome.src = imgMelt;
                    document.body.classList.remove('state-warm');
                    document.body.classList.add('state-hot');
                }

                // --- JUMP TIMING LOGIC (Exponential Curve) ---

                // 1. Temperature Thresholds
                const MIN_TEMP = 20; // °C where jumping starts getting faster
                const MAX_TEMP = 35; // °C where he melts and jumping stops

                // 2. Delay Thresholds (Milliseconds between jumps)
                const MAX_DELAY_MS = 6000; // Slowest wait time
                const MIN_DELAY_MS = 100;  // Fastest wait time (Hard cap)

                const JUMP_ANIMATION_DURATION_MS = 100; // MUST match the '1.0s' in your CSS

                // Default to the slowest wait time
                let waitTime = MAX_DELAY_MS;

                if (temp > MIN_TEMP && temp < MAX_TEMP) {
                    // Calculate 't' (a ratio from 0.0 to 1.0 based on temperature)
                    const t = (temp - MIN_TEMP) / (MAX_TEMP - MIN_TEMP);

                    // Exponential interpolation: 
                    // This creates a perfectly smooth, natural acceleration curve.
                    // At 21°C it smoothly drops to ~4570ms instead of dropping off a cliff.
                    waitTime = MAX_DELAY_MS * Math.pow(MIN_DELAY_MS / MAX_DELAY_MS, t);

                } else if (temp >= MAX_TEMP) {
                    waitTime = MIN_DELAY_MS;
                }

                // Clear any existing jump timeout
                if (window.jumpTimeout) clearTimeout(window.jumpTimeout);

                // Start the jumping loop
                function triggerJump() {
                    if (temp >= MAX_TEMP) return;

                    gnome.classList.add('jumping');

                    setTimeout(() => {
                        gnome.classList.remove('jumping');
                        window.jumpTimeout = setTimeout(triggerJump, waitTime);
                    }, JUMP_ANIMATION_DURATION_MS);
                }

                if (temp < MAX_TEMP) {
                    triggerJump();
                }

            } catch (error) {
                console.error("Error fetching weather:", error);
                tempDisplay.innerText = "Błąd API 💥";
                statusText.innerText = "Za gorąco. Serwery pogodowe się stopiły.";
            }
        }
    </script>
</body>

</html>
