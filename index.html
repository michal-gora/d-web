<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wrocław Heatwave Monitor</title>
    <!-- <link rel="stylesheet" href="style.css"> -->
    <link href="https://fonts.googleapis.com/css2?family=Just+Another+Hand&display=swap" rel="stylesheet">

    <style>
        body {
            background-color: #e2d8c3;
            /* Cobblestone-ish warm gray */
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
            font-family: 'Arial', sans-serif;
            color: #333;
            overflow-x: hidden;
        }

        #weather-dashboard {
            text-align: center;
            background: rgba(255, 255, 255, 0.5);
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
        }

        h1 {
            font-family: 'Just Another Hand', cursive;
            font-size: 5rem;
            margin: 0;
            color: #d35400;
        }

        h2 {
            font-family: 'Just Another Hand', cursive;
            font-size: 2.5rem;
            margin-top: 0;
            margin-bottom: 40px;
            color: #555;
        }

        /* --- THE SCENE --- */
        .scene {
            display: flex;
            justify-content: center;
            align-items: flex-end;
            gap: 30px;
            height: 150px;
            position: relative;
        }

        /* The Gnome */
        .gnome {
            font-size: 6rem;
            line-height: 1;
            transition: all 1s ease;
            transform-origin: bottom center;
        }

        /* The Pan */
        .pan-container {
            position: relative;
            width: 120px;
            height: 100px;
            display: flex;
            justify-content: center;
            align-items: flex-end;
        }

        .pan {
            position: absolute;
            bottom: 10px;
            width: 100px;
            height: 20px;
            background-color: #222;
            border-radius: 50%;
            box-shadow: 0 10px 10px rgba(0, 0, 0, 0.3);
        }

        /* The Pieróg */
        .pierog {
            font-size: 4rem;
            position: absolute;
            bottom: 20px;
            transition: all 1s ease;
            z-index: 2;
        }

        .fire {
            font-size: 5rem;
            position: absolute;
            bottom: 20px;
            z-index: 3;
            animation: flicker 0.2s infinite alternate;
        }

        .hide {
            display: none !important;
        }

        @keyframes flicker {
            0% {
                transform: scale(1) rotate(-5deg);
            }

            100% {
                transform: scale(1.1) rotate(5deg);
            }
        }

        /* --- HEATWAVE STATES (Triggered by JS) --- */

        /* State: Warm (Sweating gnome, golden pieróg) */
        .state-warm .gnome {
            animation: shake 2s infinite;
        }

        .state-warm .pierog {
            filter: sepia(1) saturate(3) hue-rotate(-30deg);
            /* Makes it look fried/golden */
        }

        /* State: Heatwave (Melting gnome, burning pieróg) */
        .state-hot .gnome {
            /* Melts the gnome into a puddle */
            transform: scaleY(0.4) scaleX(1.5);
            filter: grayscale(0.5) brightness(0.8) sepia(1) hue-rotate(-50deg) saturate(5);
            /* Bronze/Red hue */
        }

        .state-hot .pierog {
            filter: brightness(0.2);
            /* Turns it burnt black */
        }

        @keyframes shake {

            0%,
            100% {
                transform: translateX(0);
            }

            50% {
                transform: translateX(5px);
            }
        }
    </style>
</head>

<body>

    <div id="weather-dashboard">
        <!-- Text gets updated by JavaScript -->
        <h1 id="temp-display">Pingowanie krasnali... 📡</h1>
        <h2 id="status-text">Sprawdzanie temperatury bruku...</h2>

        <div class="scene">
            <!-- The Gnome -->
            <div id="gnome" class="gnome">🧙‍♂️</div>

            <!-- The Frying Pan & Pieróg -->
            <div class="pan-container">
                <div class="pan"></div>
                <div id="pierog" class="pierog">🥟</div>
                <div id="fire" class="fire hide">🔥</div>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            fetchWeather();
        });

        async function fetchWeather() {
            const tempDisplay = document.getElementById('temp-display');
            const statusText = document.getElementById('status-text');
            const gnome = document.getElementById('gnome');
            const fire = document.getElementById('fire');

            // Wrocław coordinates
            const lat = 51.1079;
            const lon = 27.0385;

            // Open-Meteo API URL (No API key needed!)
            const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,apparent_temperature&timezone=Europe%2FWarsaw`;

            try {
                const response = await fetch(url);
                const data = await response.json();

                const temp = data.current.temperature_2m;
                const feelsLike = data.current.apparent_temperature;

                // Update the big text
                tempDisplay.innerText = `${temp}°C`;

                // Logic for the indicators
                if (temp < 25) {
                    // Normal
                    statusText.innerHTML = `Odczuwalna: ${feelsLike}°C.<br>Krasnale są bezpieczne. Pierogi surowe.`;

                } else if (temp >= 25 && temp < 30) {
                    // Warm
                    statusText.innerHTML = `Odczuwalna: ${feelsLike}°C.<br>Idealna pogoda na smażenie pierogów na Rynku.`;
                    document.body.classList.add('state-warm');

                } else {
                    // Heatwave (30+)
                    statusText.innerHTML = `Odczuwalna: ${feelsLike}°C.<br>ALARM: Krasnale się topią! Zostań w domu!`;
                    document.body.classList.add('state-hot');
                    fire.classList.remove('hide'); // Ignite the pieróg!
                    // Change gnome to melting face emoji just for fun
                    gnome.innerText = "🫠";
                }

            } catch (error) {
                console.error("Error fetching weather:", error);
                tempDisplay.innerText = "Błąd API 💥";
                statusText.innerText = "Za gorąco. Serwery pogodowe się stopiły.";
            }
        }
    </script>

</body>

</html>
